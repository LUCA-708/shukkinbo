<!--
  📋 出勤簿（自分の事業の作業時間を記録する・1枚もの）

  🔴 外から読み込むものは一切入れない（電波が無い所でも開くため）。
  🔴 このファイルを直したら sw.js の版番号（CACHE = "shukkin-vN"）を1つ上げること。
  🔴 保存名は shukkinbo_ で始める（🧮計算機・📱タスクと同じ住所＝保存の置き場が共有）。
  中身の計算は下の LOGIC 部分。tests/test_shukkinbo.py が node で動かして確かめている。

  配色＝📱タスク（Task Desk と同じ値）。
-->
<style>
:root{
  --bg:#F7F6F2; --bg2:#F1EFE8; --card:#FFFFFF; --ink:#2C2C2A; --ink2:#5F5E5A; --muted:#888780;
  --line:#E4E1D8; --acc:#2F6F4F; --acc-soft:#E3EFE7; --ng:#C0392B; --ng-soft:#FBE7E4;
  --warn:#C97A19; --warn-soft:#FBEEDC; --brk:#6B4FA0; --brk-soft:#EEE8F7;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
html{touch-action:manipulation}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Meiryo",sans-serif;font-size:16px;
     -webkit-text-size-adjust:100%;max-width:520px;margin:0 auto;
     padding:env(safe-area-inset-top) 0 calc(64px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
/* 🔴 入力欄は16px以上＝iPhone は16px未満の入力欄を押すと勝手に拡大して戻らない */
input,select,textarea{font:inherit;font-size:16px;color:var(--ink)}
.hide{display:none!important}

#hdr{display:flex;align-items:center;gap:6px;padding:12px 14px 8px;border-bottom:1px solid var(--line)}
#hdrTitle,.edtitle{flex:1;font-size:21px;font-weight:bold}
.edhdr{display:flex;align-items:center;gap:6px;padding:12px 14px 8px;border-bottom:1px solid var(--line)}
.hbtn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 12px;font-size:15px;min-height:40px}

/* C 押し忘れの知らせ */
.warn{display:block;width:calc(100% - 28px);margin:10px 14px 0;background:var(--warn-soft);border:1px solid #E9C48F;color:#7A4A0E;
      border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.6;text-align:left}
.warn b{text-decoration:underline}

/* A 時刻 */
.now{text-align:center;padding:20px 10px 6px}
.now .date{color:var(--ink2);font-size:15px}
.now .clock{font-size:48px;font-weight:bold;letter-spacing:1px;font-variant-numeric:tabular-nums}

/* B ボタン */
.big{display:block;width:calc(100% - 40px);margin:10px 20px;padding:20px 0;border-radius:18px;text-align:center;
     font-size:22px;font-weight:bold;color:#fff;background:var(--acc)}
.big.out{background:var(--ng)}
.big:disabled{opacity:.3;cursor:default}
.subbtns{display:flex;gap:10px;margin:0 20px}
.subbtns button{flex:1;padding:13px 0;border-radius:14px;border:2px solid var(--brk);color:var(--brk);font-weight:bold;font-size:17px;background:var(--card)}
.subbtns button.on{background:var(--brk);color:#fff}
.subbtns button:disabled{opacity:.3;cursor:default}
.done{margin:12px 20px;padding:14px;border-radius:14px;background:var(--acc-soft);color:var(--acc);text-align:center;font-weight:bold}
.undo{display:flex;justify-content:space-between;align-items:center;margin:8px 20px;background:#2C2C2A;color:#fff;border-radius:12px;padding:6px 6px 6px 14px;font-size:14px}
.undo button{color:#fff;font-weight:bold;padding:8px 12px;min-height:40px}

/* D 今日の状態 */
.status{margin:12px 16px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;line-height:1.9;font-size:15px}
.status .big2{font-size:18px;font-weight:bold}
.tl{position:relative;display:flex;height:16px;border-radius:8px;overflow:hidden;margin:6px 0 2px;background:var(--bg2)}
.tl i{display:block;height:100%}
.legend{font-size:12px;color:var(--muted)}
.overtxt{color:var(--warn);font-weight:bold}

/* E・F 月 */
.mon{display:flex;align-items:center;justify-content:space-between;padding:10px 8px}
.mon button{width:48px;height:44px;font-size:20px;color:var(--ink2)}
.mon .mt{text-align:center}
.mon .mt b{font-size:18px}
.mon .mt small{display:block;color:var(--muted);font-size:12px}
.sum{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:0 12px 10px}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;font-size:12px;color:var(--ink2)}
.sum div b{display:block;font-size:18px;color:var(--ink);font-variant-numeric:tabular-nums}
.sum .wide{grid-column:1/4;background:var(--acc-soft);border-color:#C5DDCD}
.sum .wide b{display:inline;font-size:20px;color:var(--acc);margin:0 4px}
.sum .wide span{display:block;font-size:12px;color:var(--ink2)}
.sum .ov b{color:var(--warn)}

/* G 日ごとの行 */
.row{display:flex;align-items:center;gap:8px;width:100%;padding:10px 12px;border-top:1px solid var(--line);background:var(--card);text-align:left;font-size:15px;min-height:52px}
.row .d{width:62px;flex:none;font-variant-numeric:tabular-nums}
.row .d small{color:var(--muted);font-size:12px}
.row.sat .d small{color:#2D5FA0}.row.sun .d small{color:var(--ng)}
.row .tm{flex:1;min-width:0}
.row .tm small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .h{font-weight:bold;width:56px;text-align:right;font-variant-numeric:tabular-nums}
.row .h small{display:block;font-size:11px;color:var(--warn);font-weight:bold}
.row.off{background:var(--bg2);color:var(--muted)}
.row.alert{background:var(--warn-soft)}
.row.today{box-shadow:inset 4px 0 0 var(--acc)}
.tag{font-size:11px;border-radius:8px;padding:1px 6px;margin-left:4px;font-weight:bold}
.tag.m{background:#F5D9B0;color:#7A4A0E}
.empty{padding:30px 16px;text-align:center;color:var(--muted);line-height:1.8}

/* H 直す画面 */
#editor{position:fixed;inset:0;background:var(--bg);z-index:20;overflow-y:auto;
        padding:env(safe-area-inset-top) 0 calc(20px + env(safe-area-inset-bottom))}
#editor .inner{max-width:520px;margin:0 auto}
.sheet{padding:6px 16px}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);min-height:56px}
.kv > span:first-child{color:var(--ink2);flex:none}
.kv input[type=time],.kv input[type=text],.kv select{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--card);min-width:120px;text-align:center}
.kv input.memo{flex:1;text-align:left;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{padding:8px 14px;border-radius:16px;font-size:15px;background:var(--bg2);min-height:40px}
.chip.on{background:var(--ink);color:#fff}
.btn{display:block;width:100%;text-align:center;padding:13px;border-radius:14px;margin-top:12px;font-weight:bold;font-size:16px}
.btn.pri{background:var(--acc);color:#fff}
.btn.sec2{border:1px solid var(--line);background:var(--card)}
.btn.danger{border:1px solid #E7B4AD;color:var(--ng);background:var(--card)}
.btn.armed{background:var(--ng);color:#fff;border-color:var(--ng)}
.err{color:var(--ng);font-size:14px;margin-top:8px;font-weight:bold}
.note{color:var(--muted);font-size:13px;line-height:1.6;margin-top:6px}
.hist{font-size:13px;color:var(--ink2);line-height:1.7;padding:8px 0}
.hist div{border-bottom:1px dashed var(--line);padding:3px 0}

/* 設定 */
.sbox{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:12px 14px;padding:4px 14px 12px}
.sbox h3{font-size:15px;margin:10px 0 2px}
.smsg{margin:6px 14px;font-size:14px;line-height:1.6}
.smsg.ok{color:var(--acc)}.smsg.ng{color:var(--ng)}
/* 勤務日の曜日＝見出しの下の段に7等分（横に並べると iPhone の幅で「日」だけ折り返した・2026-10-05） */
.kv.wdrow{flex-direction:column;align-items:stretch;gap:8px}
.wd{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd button{height:40px;border-radius:10px;background:var(--bg2);font-size:15px}
.wd button.on{background:var(--acc);color:#fff}

/* 下の切り替え */
#tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:#FBFAF7;border-top:1px solid var(--line);
      padding-bottom:env(safe-area-inset-bottom);z-index:10}
#tabs .in{display:flex;width:100%;max-width:520px}
#tabs button{flex:1;padding:8px 0 10px;font-size:12px;color:var(--muted)}
#tabs button b{display:block;font-size:20px}
#tabs button.on{color:var(--acc);font-weight:bold}
</style>

<body>
<div id="hdr"><div id="hdrTitle">出勤簿</div></div>
<main id="view"></main>
<div id="editor" class="hide"><div class="inner" id="editorIn"></div></div>
<nav id="tabs"><div class="in">
  <button data-tab="today"><b>⏱</b>今日</button>
  <button data-tab="month"><b>📅</b>月の一覧</button>
  <button data-tab="set"><b>⚙</b>設定</button>
</div></nav>
<input type="file" id="importFile" accept=".json,application/json" class="hide">

<script>
"use strict";
// ===LOGIC-START===
// ここから下（LOGIC-END まで）は画面に触らない計算だけ。tests/test_shukkinbo.py が node で動かす。

var AUTO_BREAK_OVER = 360;   // 休憩を押さなかった日は、6時間を超えたときだけ「いつもの休憩」を引く（短い日に1時間引かれないため）
var EDIT_LOG_MAX = 20;       // 1日に残す「直した記録」の数
var WD = ["日", "月", "火", "水", "木", "金", "土"];

function pad2(n) { return (n < 10 ? "0" : "") + n; }
function ymd(d) { return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
function hmOf(d) { return pad2(d.getHours()) + ":" + pad2(d.getMinutes()); }
function isDay(s) { return /^\d{4}-\d{2}-\d{2}$/.test(String(s)); }
function toDate(s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
function addDays(s, n) { var d = toDate(s); d.setDate(d.getDate() + n); return ymd(d); }
function weekday(s) { return toDate(s).getDay(); }
function monthOf(s) { return s.slice(0, 7); }
function addMonths(ym, n) { var p = ym.split("-"); var d = new Date(+p[0], +p[1] - 1 + n, 1); return d.getFullYear() + "-" + pad2(d.getMonth() + 1); }
function daysInMonth(ym) { var p = ym.split("-"); return new Date(+p[0], +p[1], 0).getDate(); }

// "9:05" "09:05" → 545（分）。読めなければ null。0時を過ぎる勤務は扱わないので 23:59 まで
function hm2min(s) {
  var m = /^(\d{1,2}):(\d{2})$/.exec(String(s == null ? "" : s).trim());
  if (!m) return null;
  var h = +m[1], mi = +m[2];
  if (h > 23 || mi > 59) return null;
  return h * 60 + mi;
}
function min2hm(min) { return pad2(Math.floor(min / 60)) + ":" + pad2(min % 60); }
// 長さの表示 125 → "2:05"
function dur(min) {
  if (min == null || isNaN(min)) return "—";
  var neg = min < 0; min = Math.abs(Math.round(min));
  return (neg ? "-" : "") + Math.floor(min / 60) + ":" + pad2(min % 60);
}

function defaultPrefs() {
  return { start: "09:00", end: "18:00", brk: 60, workdays: [1, 2, 3, 4, 5], limit: 480, since: "", lastBackup: "" };
}

// 押して記録した休憩の合計（終わっていない休憩は endMin まで）
function breakSum(day, endMin) {
  var t = 0;
  (day.breaks || []).forEach(function (b) {
    var s = hm2min(b.s), e = b.e ? hm2min(b.e) : endMin;
    if (s != null && e != null && e > s) t += e - s;
  });
  return t;
}

// 1日の計算。nowMin＝勤務中の日を「今」まで数えるときの今の時刻（分）。勤務中でない日は渡さなくてよい
// 戻り値：{span 出勤〜退勤, brk 休憩, brkKind manual/punched/auto/none, work 作業時間, over 目安超え, open 退勤なし}
function dayWork(day, prefs, nowMin) {
  if (!day || day.kind !== "work") return null;
  var s = hm2min(day.start);
  if (s == null) return null;
  var e = day.end ? hm2min(day.end) : null;
  var open = e == null;
  var endMin = open ? (nowMin == null ? null : nowMin) : e;
  if (endMin == null) return { span: null, brk: null, brkKind: "none", work: null, over: 0, open: true };
  if (endMin < s) endMin = s;
  var span = endMin - s, brk, kind;
  if (typeof day.brkMin === "number") { brk = day.brkMin; kind = "manual"; }
  else if ((day.breaks || []).length) { brk = breakSum(day, endMin); kind = "punched"; }
  else if (!open && span > AUTO_BREAK_OVER) { brk = prefs.brk || 0; kind = "auto"; }
  else { brk = 0; kind = "none"; }
  if (brk > span) brk = span;
  var work = span - brk;
  var over = Math.max(0, work - (prefs.limit || 480));
  return { span: span, brk: brk, brkKind: kind, work: work, over: over, open: open };
}

// 今の状態：none 出勤前／working 勤務中／break 休憩中／done 退勤済み／off 休み
function stateOf(day) {
  if (!day) return "none";
  if (day.kind === "off") return "off";
  if (!day.start) return "none";
  if (day.end) return "done";
  var b = day.breaks || [];
  if (b.length && !b[b.length - 1].e) return "break";
  return "working";
}
// その状態で押せるボタン（2回押しを防ぐ＝押せないものは出さない／薄くする）
function allowedActions(day) {
  var st = stateOf(day);
  if (st === "none") return ["in"];
  if (st === "working") return ["brkIn", "out"];
  if (st === "break") return ["brkOut", "out"];
  return [];
}
function clone(o) { return o == null ? o : JSON.parse(JSON.stringify(o)); }

// ボタンを押した後の1日を返す（元は変えない）。押せない操作なら null
function punch(day, act, hm, nowIso) {
  if (allowedActions(day).indexOf(act) < 0) return null;
  var d = clone(day) || {};
  if (act === "in") d = { kind: "work", start: hm, end: null, breaks: [], memo: (day && day.memo) || "", edits: (day && day.edits) || [] };
  else if (act === "brkIn") d.breaks.push({ s: hm, e: null });
  else if (act === "brkOut") d.breaks[d.breaks.length - 1].e = hm;
  else if (act === "out") {
    var b = d.breaks || [];
    if (b.length && !b[b.length - 1].e) b[b.length - 1].e = hm;   // 休憩中に退勤＝その時刻で休憩も終わり
    d.end = hm;
  }
  d.updatedAt = nowIso;
  return d;
}

function isWorkday(date, prefs) { return (prefs.workdays || []).indexOf(weekday(date)) >= 0; }

// 1日の見え方：future 先の日／before 使い始める前／today_blank 今日まだ何もない／working 今日勤務中
// done 記録あり／forgot 退勤の押し忘れ／off 休み（選んだ）／missing 勤務日なのに記録なし／auto_off 休日で記録なし
function dayStatus(date, days, prefs, today) {
  if (date > today) return "future";
  var day = days[date];
  if (day) {
    if (day.kind === "off") return "off";
    if (!day.start) return date === today ? "today_blank" : (isWorkday(date, prefs) ? "missing" : "auto_off");
    if (day.end) return "done";
    return date === today ? "working" : "forgot";
  }
  if (date === today) return "today_blank";
  if (!prefs.since || date < prefs.since) return "before";
  return isWorkday(date, prefs) ? "missing" : "auto_off";
}

// 知らせる日（押し忘れ・勤務日の記録なし）を新しい順に。使い始めた日より前は見ない
function alertsOf(days, prefs, today) {
  var out = [];
  if (!prefs.since) return out;
  var d = addDays(today, -1), guard = 0;
  while (d >= prefs.since && guard < 4000) {
    var st = dayStatus(d, days, prefs, today);
    if (st === "forgot" || st === "missing") out.push({ date: d, status: st });
    d = addDays(d, -1); guard++;
  }
  return out;
}

// 月の合計（退勤まで入った日だけ数える＝勤務中・押し忘れは入らない）
function monthSummary(days, ym, prefs) {
  var n = 0, total = 0, over = 0;
  Object.keys(days).forEach(function (k) {
    if (monthOf(k) !== ym) return;
    var w = dayWork(days[k], prefs);
    if (!w || w.open || w.work == null) return;
    n++; total += w.work; over += w.over;
  });
  return { days: n, total: total, over: over, avg: n ? Math.round(total / n) : null };
}

// 直す画面の中身を確かめる。f = {kind, start, end, brk}（brk は "1:00" か ""＝自動）
function validateEdit(f) {
  if (f.kind === "off") return { ok: true };
  var s = hm2min(f.start);
  if (s == null) return { ok: false, why: "出勤の時刻を入れてください。" };
  var e = null;
  if (f.end) {
    e = hm2min(f.end);
    if (e == null) return { ok: false, why: "退勤の時刻が読めません。" };
    if (e <= s) return { ok: false, why: "退勤が出勤より前（または同じ）です。0時を過ぎる勤務は扱えません。" };
  }
  if (f.brk) {
    var b = hm2min(f.brk);
    if (b == null) return { ok: false, why: "休憩は「1:00」の形で入れてください。" };
    if (e != null && b >= e - s) return { ok: false, why: "休憩が出勤〜退勤の長さ以上になっています。" };
  }
  return { ok: true };
}

// 直す画面の内容から新しい1日を作る（元は変えない）。brkInit＝画面を開いたときに休憩欄に入れていた値
function applyEdit(day, f, brkInit, nowIso) {
  var old = day || {};
  var d;
  if (f.kind === "off") d = { kind: "off", memo: f.memo || "" };
  else {
    d = { kind: "work", start: f.start, end: f.end || null, breaks: clone(old.kind === "work" ? old.breaks || [] : []), memo: f.memo || "" };
    if (f.brk && f.brk !== brkInit) d.brkMin = hm2min(f.brk);
    else if (f.brk && typeof old.brkMin === "number") d.brkMin = old.brkMin;
  }
  var log = describeEdit(old, d);
  d.edits = (old.edits || []).slice();
  if (log) d.edits.push({ at: nowIso, text: log });
  if (d.edits.length > EDIT_LOG_MAX) d.edits = d.edits.slice(-EDIT_LOG_MAX);
  d.updatedAt = nowIso;
  return { day: d, changed: !!log };
}
function describeEdit(a, b) {
  var p = [];
  function show(v) { return v ? v : "--:--"; }
  if ((a.kind || "") !== b.kind) p.push("種類 " + (a.kind === "off" ? "休み" : a.kind === "work" ? "出勤" : "なし") + "→" + (b.kind === "off" ? "休み" : "出勤"));
  if (b.kind === "work") {
    if ((a.start || "") !== (b.start || "")) p.push("出勤 " + show(a.start) + "→" + show(b.start));
    if ((a.end || "") !== (b.end || "")) p.push("退勤 " + show(a.end) + "→" + show(b.end));
    var ab = typeof a.brkMin === "number" ? dur(a.brkMin) : "自動", bb = typeof b.brkMin === "number" ? dur(b.brkMin) : "自動";
    if (ab !== bb) p.push("休憩 " + ab + "→" + bb);
  }
  if ((a.memo || "") !== (b.memo || "")) p.push("メモ");
  return p.join("・");
}

// 控えファイル
function exportData(days, prefs, now) {
  return { app: "shukkinbo", version: 1, exportedAt: now.toISOString(), days: days, prefs: prefs };
}
function checkImport(o) {

// 使い始めた日：設定の日と記録の一番古い日の早い方（控えを読み込んだときに過去の記録も知らせの対象にする）

function statusBox() {

// 帯の絵：出勤〜（今 or 退勤）を、いつもの長さか実際の長さの長い方を100%として描く
function timeline(day, w) {
  var s = hm2min(day.start), e = day.end ? hm2min(day.end) : nowMin();

  V.undo = { date: t, prev: before, label: names[act] + " " + hm + " を記録しました", until: Date.now() + UNDO_MS };

function onEditorClick(ev) {

function backupText() { return JSON.stringify(exportData(S.days, S.prefs, new Date()), null, 1); }
function backupName() { var d = new Date(); return "shukkinbo_" + ymd(d).replace(/-/g, "") + "_" + pad2(d.getHours()) + pad2(d.getMinutes()) + ".json"; }
function markBackedUp(text) { S.prefs.lastBackup = today(); setMsg.backup = text; saveAll(); if (V.tab === "set") renderSettings(); }
function saveBackupFile() {
  var text = backupText(), name = backupName(), n = Object.keys(S.days).length;
  var file = null;
  try { file = new File([text], name, { type: "application/json" }); } catch (e) { file = null; }
  // iPhone は「共有」から「ファイルに保存」できる。使えなければダウンロード
  if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
    navigator.share({ files: [file] }).then(function () {
      markBackedUp("✅ 控えを書き出しました（" + name + "・" + n + "日分）。");
    }).catch(function (err) {
      if (err && err.name === "AbortError") { setMsg.backup = "書き出しをやめました（保存した日は変えていません）。"; renderSettings(); return; }
      setMsg.backup = "⚠️ 書き出せませんでした（" + (err && err.message ? err.message : "理由不明") + "）。"; renderSettings();
    });
    return;
  }
  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type: "application/json" }));
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  markBackedUp("✅ 控えを書き出しました（" + name + "・" + n + "日分）。");
}
var pendingImport = null;
function onImportFile(e) {
  var f = e.target.files && e.target.files[0];
  e.target.value = "";
  if (!f) return;
  var rd = new FileReader();
  rd.onload = function () {
    var obj = null;
    try { obj = JSON.parse(String(rd.result)); } catch (err) { obj = null; }
    var chk = checkImport(obj);
    if (!chk.ok) { pendingImport = null; setMsg.backup = "⚠️ 取り込めません：" + chk.why + "（今の記録はそのままです）"; renderSettings(); return; }
    pendingImport = chk.data;
    var when = isNaN(new Date(chk.data.exportedAt).getTime()) ? "日付不明" : ymd(new Date(chk.data.exportedAt));
    // 🔴 置き換える前に件数を見せて、もう一度押させる
    setMsg.backup = "⚠️ 今の " + Object.keys(S.days).length + "日分を、控えの " + chk.data.count + "日分（" + when + " の控え）で置き換えます。よければ下の赤いボタンを押してください。";
    renderSettings();
    var b = document.createElement("button");
    b.className = "btn armed"; b.style.width = "calc(100% - 28px)"; b.style.margin = "0 14px";
    b.setAttribute("data-set", "importGo"); b.textContent = "置き換える（" + chk.data.count + "日分）";
    el("view").appendChild(b);
  };
  rd.readAsText(f);
}
function doImport() {
  if (!pendingImport) return;
  // 🔴 置き換える前に今の全件を写しておく（押し間違えたときに戻せるように）
  try { localStorage.setItem(KEYS.beforeImport, JSON.stringify({ at: nowIso(), days: S.days, prefs: S.prefs })); }
  catch (e) { setMsg.backup = "⚠️ 今の記録を写せなかったので取り込みを止めました（空き容量を確かめてください）。"; pendingImport = null; renderSettings(); return; }
  var keepBackup = S.prefs.lastBackup;
  S.days = pendingImport.days;
  S.prefs = pendingImport.prefs;
  S.prefs.lastBackup = keepBackup;
  S.prefs.since = sinceOf(S.days, S.prefs.since, today());
  var n = Object.keys(S.days).length;
  pendingImport = null;
  setMsg.backup = saveAll() ? "✅ 控えから戻しました（" + n + "日分）。" : V.saveErr;
  renderSettings();
}

// ── 共通 ──
function render() {
  document.querySelectorAll("#tabs button").forEach(function (b) { b.classList.toggle("on", b.getAttribute("data-tab") === V.tab); });
  el("hdrTitle").textContent = V.tab === "today" ? "出勤簿" : V.tab === "month" ? "月の一覧" : "設定";
  if (V.tab === "today") renderToday();
  else if (V.tab === "month") renderMonth();
  else renderSettings();
}
function onViewClick(ev) {
  var b;
  if ((b = ev.target.closest("[data-act]"))) { if (!b.disabled) doPunch(b.getAttribute("data-act")); return; }
  if ((b = ev.target.closest("[data-undo]"))) { doUndo(); return; }
  if ((b = ev.target.closest("[data-edit]"))) { openEditor(b.getAttribute("data-edit")); return; }
  if ((b = ev.target.closest("[data-mon]"))) { V.month = addMonths(V.month || monthOf(today()), +b.getAttribute("data-mon")); renderMonth(); return; }
  if ((b = ev.target.closest("[data-wd]"))) { toggleWorkday(+b.getAttribute("data-wd")); return; }
  if ((b = ev.target.closest("[data-set]"))) {
    var a = b.getAttribute("data-set");
    if (a === "export") saveBackupFile();
    else if (a === "import") { pendingImport = null; setMsg.backup = ""; el("importFile").click(); }
    else if (a === "importGo") doImport();
  }
}
var lastDay = "";
function tick() {
  var t = today();
  if (t !== lastDay) { lastDay = t; if (!V.edit) render(); return; }   // 日付が変わったら描き直す
  if (V.tab !== "today" || V.edit) return;
  var c = el("clock"); if (c) c.textContent = hmOf(new Date());
  var s = el("todayStatus"); if (s) s.innerHTML = statusBox();
}

function start() {
  loadAll();
  lastDay = today();
  el("tabs").addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-tab]"); if (!b) return;
    V.tab = b.getAttribute("data-tab");
    if (V.tab === "month") V.month = monthOf(today());
    setMsg.backup = ""; pendingImport = null;
    render(); window.scrollTo(0, 0);
  });
  el("view").addEventListener("click", onViewClick);
  el("view").addEventListener("change", onPrefChange);
  el("editorIn").addEventListener("click", onEditorClick);
  el("importFile").addEventListener("change", onImportFile);
  document.addEventListener("visibilitychange", function () { if (!document.hidden && !V.edit) render(); });
  setInterval(tick, 15000);
  render();
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("./sw.js").catch(function () { /* 控えが作れなくても画面は使える */ });
}
start();
</script>
